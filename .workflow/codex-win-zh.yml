version: 1.0
name: codex-win-zh
displayName: Codex 汉化版 Windows 交叉编译
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main
stages:
  - stage:
      name: build
      displayName: 构建
      trigger: auto
      strategy: naturally
      steps:
        - step:
            name: compile
            displayName: 交叉编译
            script: |
              set -e
              echo "=== 安装系统依赖 ==="
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -qq || apt-get update -qq
              sudo apt-get install -y -qq mingw-w64 gcc g++ pkg-config libssl-dev python3 > /dev/null 2>&1 || true
              echo "=== 安装 Rust ==="
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal
              . "$HOME/.cargo/env"
              rustc --version
              echo "=== 配置 cargo 镜像 ==="
              mkdir -p ~/.cargo
              cat > ~/.cargo/config.toml <<'EOF'
              [source.crates-io]
              replace-with = "rsproxy-sparse"
              [source.rsproxy-sparse]
              registry = "sparse+https://rsproxy.cn/index/"
              [net]
              git-fetch-with-cli = true
              EOF
              echo "=== 去掉 rusty_v8 git patch ==="
              python3 - <<'PY'
              import re, pathlib
              p = pathlib.Path("codex-rs/Cargo.toml")
              s = p.read_text(encoding="utf-8")
              lines = s.splitlines()
              out = []
              for ln in lines:
                  if "rusty_v8" in ln and ln.lstrip().startswith("v8"):
                      out.append("# [patched] " + ln)
                  else:
                      out.append(ln)
              p.write_text("\n".join(out) + "\n", encoding="utf-8")
              print("patched")
              PY
              echo "=== 编译 ==="
              cd codex-rs
              rustup target add x86_64-pc-windows-gnu || true
              export WINDRES=$(which x86_64-w64-mingw32-windres || which windres)
              echo "WINDRES=$WINDRES"
              export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
              cargo build --release -p codex-cli --bin codex --target x86_64-pc-windows-gnu
              echo "=== 打包 ==="
              mkdir -p ../out
              cp target/x86_64-pc-windows-gnu/release/codex.exe ../out/ || true
              ls -la ../out
              sha256sum ../out/codex.exe > ../out/sha256.txt || true
              cat ../out/sha256.txt || true
            artifacts:
              - out
