name: build-win-zh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustup show
          rustc -V
          cargo -V

      - name: Ensure Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update

      - name: Build codex
        run: cargo build --release -p codex-cli --bin codex
        env:
          CARGO_TERM_COLOR: never

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          Copy-Item target/release/codex.exe ../out/codex.exe
          Get-ChildItem target/release -Filter *.exe | ForEach-Object { Copy-Item $_.FullName ../out/ -ErrorAction SilentlyContinue }
          Get-ChildItem ../out | Select-Object Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: codex-win-zh
          path: out/
          retention-days: 14
